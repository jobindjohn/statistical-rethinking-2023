[workspace]
authors = ["Jobin John <jobin.john@chalmers.se>"]
channels = ["conda-forge"]
name = "statistical-rethinking-2023"
platforms = ["win-64", "osx-arm64", "linux-64", "osx-64"]
version = "0.1.0"

[tasks]
lab = { cmd = "jupyter lab", description = "Launch JupyterLab with the lecture notebooks" }
utils = { cmd = "marimo edit utils.py", description = "Open utils.py as a marimo notebook with demos of each helper" }

[dependencies]
python = ">=3.12"
pymc = ">=6.3,<7"
arviz = ">=1.3,<2"
nutpie = "*"
numba = "*"
numpy = "*"
scipy = "*"
pandas = "*"
xarray = "*"
statsmodels = "*"
patsy = "*"
matplotlib-base = "*"
seaborn = "*"
networkx = "*"
python-graphviz = "*"
graphviz = "*"
colorama = "*"
watermark = "*"
ipykernel = "*"
jupyterlab = ">=4"
marimo = ">=0.25.1,<0.26"
